<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamScene Lab Live Loader</title>
  <link rel="icon" href="https://githubusercontent.com" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b0b;
      --surface: #151515;
      --surface2: #212121;
      --accent: #FFCE00;
      --accent2: #FEF698;
      --border: #3a3a3a;
      --text: #ffffff;
      --text-muted: #a8a8a8;
      --danger: #e5484d;
      --grad: linear-gradient(180deg, #FEF698 0%, #FFCE00 100%);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .loader-card {
      background: linear-gradient(180deg, #191919, #111111);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      padding: 32px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    .loader-logo {
      height: 46px;
      width: auto;
      display: block;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .loader-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Classic theme support if saved in localStorage */
    html[data-theme="classic"] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #7c5cbf;
      --accent2: #a78bfa;
      --border: #2e3350;
      --text: #e2e8f0;
      --text-muted: #8892b0;
      --danger: #f87171;
    }
    html[data-theme="classic"] .loader-card {
      background: var(--surface);
      border-top-color: var(--accent2);
    }
    html[data-theme="classic"] .loader-title {
      background: none;
      -webkit-text-fill-color: var(--accent2);
      color: var(--accent2);
    }
    .logo-classic { display: none; }
    html[data-theme="classic"] .logo-ssl { display: none; }
    html[data-theme="classic"] .logo-classic { display: block; }
  </style>
  <script>
    try {
      if (localStorage.getItem('ssl-theme') === 'classic') {
        document.documentElement.dataset.theme = 'classic';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="loader-card" id="loader-container">
    <img class="loader-logo logo-ssl" src="https://githubusercontent.com" alt="StreamScene Lab" />
    <img class="loader-logo logo-classic" src="https://githubusercontent.com" alt="StreamScene Lab" />
    <div class="spinner"></div>
    <div>
      <div class="loader-title">Loading StreamScene Lab</div>
      <div class="loader-sub">Fetching latest build...</div>
    </div>
  </div>

  <script>
    const remoteURL = "https://raw.githubusercontent.com/ScareTheVoices/Tools/refs/heads/main/ToolBox/obsstreamcreator.html";

    fetch(remoteURL)
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to fetch latest obsstreamcreator.html");
        }
        return response.text();
      })
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const icon = doc.querySelector('link[rel="icon"], link[rel="shortcut icon"]');
        if (icon) {
          let existing = document.querySelector('link[rel="icon"]');
          if (existing) existing.remove();
          document.head.appendChild(icon.cloneNode(true));
        }

        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        const container = document.getElementById("loader-container");
        container.style.borderTopColor = "var(--danger)";
        container.innerHTML = `
          <div style="color:var(--danger);font-weight:700;font-size:1rem;">Error Loading Build</div>
          <div style="color:var(--text-muted);font-size:0.85rem;">${error.message}</div>
        `;
      });
  </script>
</body>
</html>
